<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jafar AI</title>

<style>
body{
  font-family:Arial,sans-serif;
  max-width:650px;
  margin:auto;
  padding:18px;
  background:#f3f4f6;
}
h1{text-align:center}
.card{
  background:white;
  padding:18px;
  margin-bottom:18px;
  border-radius:14px;
}
input,textarea,select,button{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  margin-top:7px;
  margin-bottom:10px;
  font-size:16px;
}
button{
  cursor:pointer;
  font-weight:bold;
}
.item{
  border:1px solid #ddd;
  border-radius:10px;
  padding:12px;
  margin:10px 0;
}
.item p{
  white-space:pre-wrap;
}
.actions{
  display:flex;
  gap:8px;
}
.actions button{
  width:50%;
}
.status{
  text-align:center;
  font-weight:bold;
  margin:10px;
}
small{color:#666}
</style>
</head>

<body>

<h1>Jafar AI</h1>

<div class="card">
<h2>🧠 إضافة للذاكرة</h2>

<select id="category">
<option value="personal">معلومة شخصية</option>
<option value="business">عمل</option>
<option value="instruction">تعليمات للمساعدة</option>
<option value="temporary">معلومة مؤقتة</option>
</select>

<textarea id="memory" rows="4"
placeholder="اكتب المعلومة هنا"></textarea>

<button onclick="addMemory()">حفظ في الذاكرة</button>
</div>

<div class="card">
<h2>📅 إضافة موعد</h2>

<input id="title" placeholder="اسم الموعد">

<textarea id="details" rows="3"
placeholder="ملاحظات"></textarea>

<label>البداية</label>
<input id="start" type="datetime-local">

<label>النهاية</label>
<input id="end" type="datetime-local">

<label>هل مسموح للمساعدة بذكر تفاصيل الموعد؟</label>

<select id="share">
<option value="false">لا - خاص</option>
<option value="true">نعم</option>
</select>

<button onclick="addSchedule()">حفظ الموعد</button>
</div>

<div id="status" class="status"></div>

<div class="card">
<h2>🧠 الذاكرة المحفوظة</h2>
<button onclick="loadMemory()">تحديث الذاكرة</button>
<div id="memoryList">جاري التحميل...</div>
</div>

<div class="card">
<h2>📅 المواعيد المحفوظة</h2>
<button onclick="loadSchedule()">تحديث المواعيد</button>
<div id="scheduleList">جاري التحميل...</div>
</div>

<script>
function showStatus(message){
  document.getElementById("status").textContent=message;
}

async function addMemory(){
  const category=document.getElementById("category").value;
  const content=document.getElementById("memory").value.trim();

  if(!content){
    showStatus("اكتب المعلومة أولاً");
    return;
  }

  const response=await fetch("/admin/memory",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({category,content})
  });

  if(response.ok){
    document.getElementById("memory").value="";
    showStatus("✅ تم حفظ المعلومة");
    await loadMemory();
  }else{
    showStatus("❌ فشل حفظ المعلومة");
  }
}

async function loadMemory(){
  const response=await fetch("/admin/memory");

  if(!response.ok){
    document.getElementById("memoryList").textContent=
      "تعذر تحميل الذاكرة";
    return;
  }

  const rows=await response.json();
  const box=document.getElementById("memoryList");

  box.innerHTML="";

  if(!rows.length){
    box.textContent="لا توجد معلومات محفوظة";
    return;
  }

  rows.forEach(row=>{
    const item=document.createElement("div");
    item.className="item";

    const text=document.createElement("p");
    text.textContent=row.content;

    const category=document.createElement("small");
    category.textContent="النوع: "+row.category;

    const actions=document.createElement("div");
    actions.className="actions";

    const edit=document.createElement("button");
    edit.textContent="✏️ تعديل";
    edit.onclick=()=>editMemory(row);

    const remove=document.createElement("button");
    remove.textContent="🗑️ حذف";
    remove.onclick=()=>deleteMemory(row.id);

    actions.append(edit,remove);
    item.append(text,category,actions);
    box.appendChild(item);
  });
}

async function editMemory(row){
  const content=prompt("عدّل المعلومة:",row.content);

  if(content===null || !content.trim()) return;

  const response=await fetch("/admin/memory/"+row.id,{
    method:"PUT",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({content:content.trim()})
  });

  if(response.ok){
    showStatus("✅ تم تعديل المعلومة");
    await loadMemory();
  }else{
    showStatus("❌ فشل تعديل المعلومة");
  }
}

async function deleteMemory(id){
  if(!confirm("هل تريد حذف هذه المعلومة؟")) return;

  const response=await fetch("/admin/memory/"+id,{
    method:"DELETE"
  });

  if(response.ok){
    showStatus("✅ تم حذف المعلومة");
    await loadMemory();
  }else{
    showStatus("❌ فشل حذف المعلومة");
  }
}

async function addSchedule(){
  const title=document.getElementById("title").value.trim();
  const details=document.getElementById("details").value.trim();
  const starts_at=document.getElementById("start").value;
  const ends_at=document.getElementById("end").value;
  const share_with_callers=
    document.getElementById("share").value==="true";

  if(!title || !starts_at){
    showStatus("اكتب اسم الموعد ووقت البداية");
    return;
  }

  const response=await fetch("/admin/schedule",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      title,
      details,
      starts_at,
      ends_at:ends_at||null,
      share_with_callers
    })
  });

  if(response.ok){
    document.getElementById("title").value="";
    document.getElementById("details").value="";
    document.getElementById("start").value="";
    document.getElementById("end").value="";
    showStatus("✅ تم حفظ الموعد");
    await loadSchedule();
  }else{
    showStatus("❌ فشل حفظ الموعد");
  }
}

async function loadSchedule(){
  const response=await fetch("/admin/schedule");

  if(!response.ok){
    document.getElementById("scheduleList").textContent=
      "تعذر تحميل المواعيد";
    return;
  }

  const rows=await response.json();
  const box=document.getElementById("scheduleList");

  box.innerHTML="";

  if(!rows.length){
    box.textContent="لا توجد مواعيد محفوظة";
    return;
  }

  rows.forEach(row=>{
    const item=document.createElement("div");
    item.className="item";

    const heading=document.createElement("strong");
    heading.textContent=row.title;

    const info=document.createElement("p");

    const start=new Date(row.starts_at).toLocaleString();
    const end=row.ends_at
      ? new Date(row.ends_at).toLocaleString()
      : "غير محدد";

    info.textContent=
      (row.details||"")+
      "\nالبداية: "+start+
      "\nالنهاية: "+end;

    const privacy=document.createElement("small");
    privacy.textContent=row.share_with_callers
      ? "مسموح للمساعدة بذكر التفاصيل"
      : "خاص - لا تذكر المساعدة التفاصيل";

    const actions=document.createElement("div");
    actions.className="actions";

    const edit=document.createElement("button");
    edit.textContent="✏️ تعديل";
    edit.onclick=()=>editSchedule(row);

    const remove=document.createElement("button");
    remove.textContent="🗑️ حذف";
    remove.onclick=()=>deleteSchedule(row.id);

    actions.append(edit,remove);
    item.append(heading,info,privacy,actions);
    box.appendChild(item);
  });
}

async function editSchedule(row){
  const title=prompt("اسم الموعد:",row.title);

  if(title===null || !title.trim()) return;

  const details=prompt(
    "الملاحظات:",
    row.details||""
  );

  if(details===null) return;

  const response=await fetch("/admin/schedule/"+row.id,{
    method:"PUT",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      title:title.trim(),
      details
    })
  });

  if(response.ok){
    showStatus("✅ تم تعديل الموعد");
    await loadSchedule();
  }else{
    showStatus("❌ فشل تعديل الموعد");
  }
}

async function deleteSchedule(id){
  if(!confirm("هل تريد حذف هذا الموعد؟")) return;

  const response=await fetch("/admin/schedule/"+id,{
    method:"DELETE"
  });

  if(response.ok){
    showStatus("✅ تم حذف الموعد");
    await loadSchedule();
  }else{
    showStatus("❌ فشل حذف الموعد");
  }
}

loadMemory();
loadSchedule();
</script>

</body>
</html>
