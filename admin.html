<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jafar AI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 14px;
    }
    input, textarea, select, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 12px;
      font-size: 16px;
    }
    button {
      cursor: pointer;
      font-weight: bold;
    }
    h1 {
      text-align: center;
    }
    #status {
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>Jafar AI</h1>

<div class="card">
  <h2>🧠 إضافة للذاكرة</h2>

  <select id="category">
    <option value="personal">معلومة شخصية</option>
    <option value="business">عمل</option>
    <option value="instruction">تعليمات للمساعدة</option>
    <option value="temporary">معلومة مؤقتة</option>
  </select>

  <textarea
    id="memory"
    rows="4"
    placeholder="مثال: لو اتصل شخص بخصوص Veridexa خدي منه اسمه وسبب الاتصال."
  ></textarea>

  <button onclick="addMemory()">
    حفظ في الذاكرة
  </button>
</div>

<div class="card">
  <h2>📅 إضافة موعد</h2>

  <input
    id="title"
    placeholder="اسم الموعد"
  >

  <textarea
    id="details"
    rows="3"
    placeholder="ملاحظات"
  ></textarea>

  <label>البداية</label>
  <input
    id="start"
    type="datetime-local"
  >

  <label>النهاية</label>
  <input
    id="end"
    type="datetime-local"
  >

  <label>هل مسموح للمساعدة بذكر تفاصيل الموعد؟</label>

  <select id="share">
    <option value="false">لا - خاص</option>
    <option value="true">نعم</option>
  </select>

  <button onclick="addSchedule()">
    حفظ الموعد
  </button>
</div>

<p id="status"></p>

<script>
async function addMemory() {
  const category = document.getElementById("category").value;
  const content = document.getElementById("memory").value.trim();

  if (!content) {
    showStatus("اكتب المعلومة أولاً");
    return;
  }

  const response = await fetch("/admin/memory", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      category,
      content
    })
  });

  if (response.ok) {
    document.getElementById("memory").value = "";
    showStatus("✅ تم حفظ المعلومة");
  } else {
    showStatus("❌ فشل الحفظ");
  }
}

async function addSchedule() {
  const title = document.getElementById("title").value.trim();
  const details = document.getElementById("details").value.trim();
  const starts_at = document.getElementById("start").value;
  const ends_at = document.getElementById("end").value;
  const share_with_callers =
    document.getElementById("share").value === "true";

  if (!title || !starts_at) {
    showStatus("اكتب اسم الموعد ووقت البداية");
    return;
  }

  const response = await fetch("/admin/schedule", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      title,
      details,
      starts_at,
      ends_at: ends_at || null,
      share_with_callers
    })
  });

  if (response.ok) {
    document.getElementById("title").value = "";
    document.getElementById("details").value = "";
    document.getElementById("start").value = "";
    document.getElementById("end").value = "";

    showStatus("✅ تم حفظ الموعد");
  } else {
    showStatus("❌ فشل حفظ الموعد");
  }
}

function showStatus(message) {
  document.getElementById("status").textContent = message;
}
</script>

</body>
</html>
